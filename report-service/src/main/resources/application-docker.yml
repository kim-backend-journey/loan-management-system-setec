server:
  port: 8083

spring:
  application:
    name: report-service

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:lms_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres123}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    servers:
      - url: "https://loan.cavkim.tech"
        description: "Production"
      - url: "http://localhost:8080"
        description: "Local"