server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**
        - id: operation-service
          uri: http://operation-service:8082
          predicates:
            - Path=/api/v1/customers/**,/api/v1/applications/**,/api/v1/loans/**,/api/v1/loan-products/**,/api/v1/notifications/**
        - id: report-service
          uri: http://report-service:8083
          predicates:
            - Path=/api/v1/reports/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true