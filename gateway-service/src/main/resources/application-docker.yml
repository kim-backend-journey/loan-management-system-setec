server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**
        - id: operation-service
          uri: http://operation-service:8082
          predicates:
            - Path=/api/v1/customers/**,/api/v1/applications/**,/api/v1/loans/**,/api/v1/loan-products/**,/api/v1/notifications/**
        - id: report-service
          uri: http://report-service:8083
          predicates:
            - Path=/api/v1/reports/**
        - id: auth-service-docs
          uri: http://auth-service:8081
          predicates:
            - Path=/auth-docs/**
          filters:
            - RewritePath=/auth-docs/(?<segment>.*), /$\{segment}
        - id: operation-service-docs
          uri: http://operation-service:8082
          predicates:
            - Path=/operation-docs/**
          filters:
            - RewritePath=/operation-docs/(?<segment>.*), /$\{segment}
        - id: report-service-docs
          uri: http://report-service:8083
          predicates:
            - Path=/report-docs/**
          filters:
            - RewritePath=/report-docs/(?<segment>.*), /$\{segment}
    globalcors:
      corsConfigurations:
        '[/**]':
          allowedOriginPatterns:
            - "*"
          allowedMethods:
            - "*"
          allowedHeaders:
            - "*"
          allowCredentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth-docs/v3/api-docs
      - name: Operation Service
        url: /operation-docs/v3/api-docs
      - name: Report Service
        url: /report-docs/v3/api-docs
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}