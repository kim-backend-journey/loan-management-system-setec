global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [lms-auth:8081]

  - job_name: operation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [lms-operation:8082]

  - job_name: report-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [lms-report:8083]

  - job_name: cron-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [lms-cron:8084]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [lms-gateway:8080]
